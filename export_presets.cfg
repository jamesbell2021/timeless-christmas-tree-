html/head_include="<meta name=\"description\" content=\"A Timeless Christmas Tree: an Edwardian Yuletide. A cosy tree-decorating game.\">\n<script>\n/* iPhone and iPad sound fix. iOS mutes web audio when the ring/silent switch is on, and only lets a page start sound from inside a real tap. */\n(function () {\n  try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) {}\n  var Orig = window.AudioContext || window.webkitAudioContext;\n  var ctxs = [];\n  window.__tctAudio = { ctxs: ctxs, starts: 0, errors: [] };\n  if (Orig) {\n    var Tracked = function (opts) { var c = opts ? new Orig(opts) : new Orig(); ctxs.push(c); return c; };\n    Tracked.prototype = Orig.prototype;\n    window.AudioContext = Tracked;\n    if (window.webkitAudioContext) { window.webkitAudioContext = Tracked; }\n  }\n  if (window.AudioBufferSourceNode) {\n    var st = AudioBufferSourceNode.prototype.start;\n    AudioBufferSourceNode.prototype.start = function () { window.__tctAudio.starts++; return st.apply(this, arguments); };\n  }\n  window.addEventListener('error', function (e) { window.__tctAudio.errors.push(String(e.message || e)); });\n  var silent = null;\n  function silentUrl() {\n    var n = 4410, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);\n    function w(o, s) { for (var i = 0; i < s.length; i++) { v.setUint8(o + i, s.charCodeAt(i)); } }\n    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');\n    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);\n    v.setUint32(24, 22050, true); v.setUint32(28, 44100, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);\n    w(36, 'data'); v.setUint32(40, n * 2, true);\n    return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));\n  }\n  function unlock() {\n    for (var i = 0; i < ctxs.length; i++) {\n      var c = ctxs[i];\n      if (c.state !== 'running' && c.state !== 'closed') { try { c.resume(); } catch (e) {} }\n    }\n    if (!navigator.audioSession && !silent) {\n      try {\n        silent = new Audio(silentUrl());\n        silent.loop = true;\n        silent.setAttribute('playsinline', '');\n        var p = silent.play();\n        if (p && p.catch) { p.catch(function () { silent = null; }); }\n      } catch (e) { silent = null; }\n    }\n  }\n  ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'mousedown', 'click', 'keydown'].forEach(function (ev) {\n    window.addEventListener(ev, unlock, { capture: true, passive: true });\n  });\n  document.addEventListener('visibilitychange', function () { if (!document.hidden) { unlock(); } });\n  /* Add ?audiodebug to the address to see what the browser's sound system is doing. */\n  if (location.search.indexOf('audiodebug') >= 0) {\n    window.addEventListener('DOMContentLoaded', function () {\n      var d = document.createElement('div');\n      d.style.cssText = 'position:fixed;left:6px;top:6px;z-index:99999;background:rgba(0,0,0,.82);color:#ffe9a8;font:13px/1.35 monospace;padding:8px 10px;border:1px solid #c9a14a;max-width:92vw;white-space:pre-wrap;pointer-events:auto';\n      var btn = document.createElement('button');\n      btn.textContent = 'Beep through the game';\n      btn.style.cssText = 'display:block;margin-top:6px;font:14px monospace;padding:6px 10px';\n      btn.addEventListener('click', function (ev) {\n        ev.stopPropagation();\n        var c = ctxs[0];\n        if (!c) { return; }\n        try { c.resume(); } catch (e) {}\n        var o = c.createOscillator(), g = c.createGain();\n        o.frequency.value = 660; g.gain.value = 0.25;\n        o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.6);\n      });\n      var txt = document.createElement('div');\n      d.appendChild(txt); d.appendChild(btn); document.body.appendChild(d);\n      setInterval(function () {\n        var s = ctxs.map(function (c) { return c.state + ' @' + c.sampleRate + 'Hz t=' + c.currentTime.toFixed(1); }).join(' | ');\n        txt.textContent = 'contexts: ' + (s || 'none yet') + '\\naudioSession: ' + (navigator.audioSession ? navigator.audioSession.type + ' / ' + navigator.audioSession.state : 'not supported') +\n          '\\nsounds started: ' + window.__tctAudio.starts + '\\nerrors: ' + (window.__tctAudio.errors.slice(-3).join(' ; ') || 'none') + '\\n' + navigator.userAgent;\n      }, 500);\n    });\n  }\n})();\n</script>"
